solid #52a7ff;border-radius:10px;padding:21px 23px;font-size:clamp(18px,2.1vw,23px);line-height:1.55;white-space:pre-line}.instruction{color:#a6bfe0;line-height:1.6;margin:21px 0}.choices{display:flex;flex-wrap:wrap;gap:11px;margin-top:25px}.choices button{flex:1;min-width:160px;padding:16px}.footerline{margin-top:27px;padding-top:17px;border-top:1px solid #294260;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{background:#1b3558;height:7px;border-radius:99px;overflow:hidden;margin:21px 0 10px}.progress i{display:block;background:#49a5ff;height:100%;transition:width .2s}.overlay{position:fixed;inset:0;z-index:50;background:#020715bd;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{background:#11233e;border:1px solid #4c6791;border-radius:20px;width:min(760px,100%);max-height:88vh;overflow:auto;padding:26px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:15px}.modal h2{margin:0}.tabs{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}.tabs button.selected{background:#2771d3}.rebuttal{background:#1a3153;padding:19px;border-radius:11px;margin:13px 0;line-height:1.6}.rebuttal h3{margin:0 0 8px;color:#89c7ff;font-size:16px}.alert{background:#342d2d;border:1px solid #88644a;padding:13px;border-radius:9px;color:#ffd9a6;margin:14px 0}.tag{display:inline-block;border:1px solid #4d6587;padding:4px 8px;border-radius:8px;color:#b1c9ea;font-size:12px;margin:3px}.source{font-size:12px;color:#829dbf;margin-top:20px}#backBtn:disabled{opacity:.35;cursor:not-allowed}@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{display:none}.panel{min-height:0}.bar{padding:13px}.nav button{padding:8px}.choices button{min-width:120px}}@media print{header,.sidebar,.choices,.footerline{display:none}body{background:white;color:black}.layout{display:block}.panel{box-shadow:none;border:0}.speak{color:black}}
</style></head><body><header><div class="bar"><div class="brand">✦ HELPING HANDS <small>Interactive agent scripting guide</small></div><div class="nav"><button data-rebut="debt">Debt rebuttals</button><button data-rebut="health">ACA / Medicare whys</button><button data-rebut="general">Other rebuttals</button><button class="danger" id="resetTop">↻ Reset Call</button></div></div></header><main class="layout"><aside class="sidebar"><h3>Call flow</h3><div id="stages"></div><div class="progress"><i id="progressBar"></i></div><div class="tiny muted" id="counter"></div><p class="tiny muted">Guide only. No personal data collected, saved, or transmitted.</p><div class="alert tiny">Where source documents disagree about eligibility, confirm current program rules with your supervisor.</div></aside><section class="panel" aria-live="polite"><span class="pill" id="phase">START</span><h1 id="heading">Welcome</h1><div id="bodyText" class="speak"></div><div class="instruction" id="note"></div><div class="choices" id="choices"></div><div class="footerline"><button id="backBtn">← Back</button><span class="tiny muted" id="trail"></span><button class="danger" id="resetBottom">↻ Reset Call</button></div><div class="source" id="source"></div></section></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="rebutTitle"><div class="modal"><div class="modalHead"><h2 id="rebutTitle">Rebuttal library</h2><button id="closeModal">✕ Close</button></div><div class="tabs"><button data-tab="debt">Debt</button><button data-tab="health">ACA / Medicare</button><button data-tab="general">General questions</button></div><div id="rebutContent"></div></div></div><script>
'use strict';
// No member information is ever requested or stored. In-memory flow state only.
const N={};const add=(id,phase,title,script,note,options,source='Helping Hands scripts')=>N[id]={id,phase,title,script,note,options,source};
const opt=(label,to)=>({label,to});
add('start','Intro','Greeting and call purpose','Good Morning/Afternoon, my name is [Agent first name] from Helping Hands. Are you calling about hardship assistance?','MEMBER: Will typically say Yes. Follow the caller’s actual response. This is a read-aloud guide only; no caller details are entered here.',[opt('Yes — Continue','intro_details'),opt('No — Close call','end')]);
add('intro_details','Intro','Confirm member information','May I please have your name, state and zip code where you reside, and your date of birth?','AGENT: If details are available in your authorized system, confirm them; otherwise enter them only in your authorized CRM. Do not enter any personal data in this scripting guide.',[opt('Continue — Reference number','intro_reference')]);
add('intro_reference','Intro','Ask for the reference number','Nice to meet you, [First Name]. May I please have the 6 Digit Reference Number that was provided to you?','MEMBER: Provides the reference number. The original script uses 692546 as its example; verify the number actually given by the caller.',[opt('Continue — Confirm number','intro_ref_confirm')]);
add('intro_ref_confirm','Intro','Confirm the reference number','Great! To confirm, you said 692546.','MEMBER: Confirm Yes. IMPORTANT: 692546 is the example in the boss-approved intro; read back the caller’s actual reference number if it differs.',[opt('Yes — Continue','intro_callback'),opt('No — Clarify number','intro_reference')]);
add('intro_callback','Intro','Ask for callback number','Also, what is a good call back number in case we are disconnected?','MEMBER: Gives a callback number. Only document it in your authorized CRM if required; this site has no personal-information fields.',[opt('Continue — Hardship','hardship')]);
add('hardship','Intro','Understand the member’s hardship','Thank you for providing those information. To ensure you receive all these benefits you may be eligible for, I’d like to understand a bit more about your current hardship challenges. Can you please tell me more about what type of hardship you and your family are currently going through?','MEMBER: Explains their hardship. Let them finish. If they need clarification, ask whether they are unemployed or facing financial problems. Show engagement: “That must be tough” or “I am sorry to hear that.”',[opt('Member finished — Continue','empathy')]);
add('empathy','Intro','Acknowledge their story','I am sorry to hear that you and your family are going through this...','AGENT: Give the member time to finish their story before continuing.',[opt('Continue — Benefits Processing Team','intro_benefits')]);
add('intro_benefits','Intro','Explain the next step','I do have some great news — I’ve submitted your application to our Benefits Processing Team, and we will just wait for approval. In the meantime, I also see you may be eligible for additional benefits that could help with things like lowering monthly bills, healthcare access, or other financial relief programs. I just need to ask you few questions to understand your situation better. Some of these government programs are time sensitive so I would like to see if we can put you in one of these programs the soonest as I see you badly need the help. Dont worry, I am you case manager and I will try to do the best I can to help you find ways to make you situation better.','IMPORTANT: This is the boss-provided wording. Say an application has been submitted only if its submission is confirmed in your authorized system. Do not imply benefits are approved.',[opt('Continue — Income transition','intro_income_transition')]);
add('intro_income_transition','Intro','Transition to income screening','Let’s start by checking if we can improve your income.','Continue into the appropriate age-based qualification flow. Select the age bracket based on the age verified in your authorized system; this guide does not collect birthdate.',[opt('Continue — Select age track','age')]);
add('age','Routing','Choose the correct script track','Can you please confirm you age.','Age determines which of the three source scripts to follow. Do not request or store their date of birth here.',[opt('Age 18–48 • ACA','young_income'),opt('Age 49–63 • SSDI','middle_income'),opt('Age 64+ • Medicare','senior_income')]);
function income(id,track,next){add(id,'Income screening',track+' — employment and income','Are you currently employed? And roughly what is your annual income?','Use the responses to decide whether to ask financial-program screening questions. Source scripts say income of $24,000+ proceeds to Debt; around $30,000+ and employed may proceed to Tax/Personal Loans. These thresholds and the $30,000 boundary need supervisor confirmation.',[opt('Income $24,000+ — financial screening','debt_q1'),opt('Below $24,000 — other programs',next),opt('Skip financial screening',next)]);}
income('young_income','Age 18–48','aca_state');income('middle_income','Age 49–63','ssdi_fulltime');income('senior_income','Age 64+','medicare_state');
add('debt_q1','Debt screening','Unsecured balances','How much credit card debt are you struggling to pay? Do you also have unsecured personal loans?','If yes, ask the approximate combined amount. Source transfers use a minimum $7,500 total debt in screening, while some handoffs say $10,000. Verify partner minimum before making an eligibility claim.',[opt('Combined unsecured debt $7,500+','debt_q2'),opt('Below $7,500 / unsure','finance_after_debt')]);
add('debt_q2','Debt screening','Monthly debt payments','For these unsecured debts, are you currently paying at least $250 per month?','If the answer is yes and the combined debt meets current program criteria, the source moves to a Debt transfer offer.',[opt('Yes — offer Debt','debt_offer'),opt('No — next program','finance_after_debt')]);
add('debt_offer','Debt transfer','Offer debt specialist','Based on the unsecured debt you mentioned, I can connect you with a specialist to review possible debt relief options, explain the program, and check eligibility. Would you like me to connect you?','Do not guarantee savings or debt reductions. A clear YES is required.',[opt('Yes — transfer instructions','debt_transfer'),opt('Not sure — rebuttal','debt_hesitant'),opt('No — next program','finance_after_debt')]);
add('debt_hesitant','Debt rebuttal','If the member hesitates','I understand. The goal is simply to explore whether any available options might make your monthly obligations more manageable. The specialist can explain terms, costs, and eligibility. Would you like to speak with them?','Use the Debt Rebuttals top button for the fuller “why” explanations.',[opt('Yes — transfer','debt_transfer'),opt('No — continue','finance_after_debt')]);
add('debt_transfer','Warm transfer','Debt transfer handshake','Great. I’m connecting you with a senior agent who can explain debt relief options and check whether you qualify. Please stay on the line.\n\nTo the specialist: I have a Helping Hands community member on the line interested in reviewing unsecured debt options. I’ll step off the line now to protect their privacy.','WARM TRANSFER. Confirm member consent first. Only state debt amounts you actually verified. The source documents disagree on minimums.',[opt('Transfer complete — finish','end'),opt('Explore other programs','finance_after_debt')]);
add('finance_after_debt','Financial screening','Additional program screening','We can also see whether any other options are worth exploring.','Personal Loans in the source generally require employed, $30,000+ income, $15,000 credit-card debt and 550+ credit score. Tax screening generally targets employed members with $30,000+ income; its debt minimum conflicts between $8,000 and $10,000.',[opt('Meets Personal Loan prerequisites','loan_score'),opt('Ask Tax screening','tax_q'),opt('Continue to age-based programs','age_fallback')]);
add('loan_score','Personal Loans','Credit score question','Do you happen to know your credit score? Is it 550 or higher?','Only use this branch when the source prerequisites are met. This guide does not record any score.',[opt('Yes, 550+ — offer','loan_offer'),opt('No / below 550 / unknown','tax_q')]);
add('loan_offer','Personal Loans','Offer specialist','There may be a personal loan option worth exploring. A specialist can review the program, available terms, and whether you qualify. May I connect you?','Avoid promising approval or funding. Transfer with clear consent.',[opt('Yes — transfer','loan_transfer'),opt('No — next','tax_q')]);
add('loan_transfer','Transfer','Personal Loans transfer','Thank you. I’ll connect you with a specialist who can discuss the available loan options and eligibility. You may briefly hear ringing or music.','Source indicates a cold transfer for the 64+ personal loan track. Follow your current approved transfer procedure.',[opt('Complete','end'),opt('Continue other programs','tax_q')]);
add('tax_q','Tax screening','Outstanding state or IRS tax debt','Do you have outstanding tax debt to your state or the IRS?','Source thresholds conflict: one screen asks about $10,000+, but an instruction says $8,000+ with $30,000 income and employment. Verify minimum before offering; do not claim qualification solely based on this guide.',[opt('May meet current tax criteria','tax_offer'),opt('No / does not meet requirements','age_fallback')]);
add('tax_offer','Tax transfer','Offer Tax specialist','Based on what you shared, I can connect you with a specialist who can explain potential tax relief options and check whether you qualify. Is that okay?','Make no guarantees of settlement or government approval.',[opt('Yes — warm transfer','tax_transfer'),opt('No — continue','age_fallback')]);
add('tax_transfer','Warm transfer','Tax handoff','Just to confirm, I’m transferring you to a senior agent to discuss tax relief options and whether you might qualify. Please stay on the line.\n\nTo the specialist: I have a Helping Hands community member interested in reviewing possible tax-relief options. I’ll step off the line now for privacy.','Confirm YES before connecting. Warm transfer.',[opt('Complete','end'),opt('Explore other programs','age_fallback')]);
let activeTrack='young';const fallback={young:'aca_state',middle:'ssdi_fulltime',senior:'medicare_state'};
add('age_fallback','Routing','Continue with the age-specific script','Let’s see what other available programs may fit your situation.','Continue the track selected earlier.',[opt('Continue',()=>fallback[activeTrack])]);
add('aca_state','ACA screening','Check ACA state availability','Before I discuss coverage, I’d like to see whether the ACA program is available in your state.','Current ACA state list in the body of the 18–48 document: AL, AZ, CO, FL, GA, IN, KS, LA, MI, MO, MS, MT, NC, ND, NE, OH, OK, SC, TN, TX, WI, WV, WY. The same document has a different state list at the top. Verify current routing list.',[opt('State is on verified list','aca_coverage'),opt('Not available / unsure','mva_q')]);
add('aca_coverage','ACA screening','Check existing coverage','Do you currently have Medicaid, Medicare, TRICARE, Medi-Cal, VA benefits, employer-provided health insurance, or private insurance?','The 18–48 document sends members with no coverage to the ACA offer. Do not determine formal eligibility.',[opt('No existing coverage','aca_offer'),opt('Has coverage / unsure','mva_q')]);
add('aca_offer','ACA transfer','Offer coverage review','You may be able to explore health coverage options, depending on eligibility and your state. A specialist can review plans and any available savings with you. Would you like me to connect you?','Premiums and financial assistance are not guaranteed. Use ACA / Medicare Whys for affordability concerns.',[opt('Yes — warm transfer','aca_transfer'),opt('No — continue','mva_q')]);
add('aca_transfer','Warm transfer','ACA handshake','Great. I’ll connect you with a specialist who can review ACA coverage options and potential savings. Please stay on the line.\n\nTo the specialist: I have a Helping Hands member interested in exploring health-insurance options. Thank you.','WARM TRANSFER. Confirm clear consent.',[opt('Complete','end'),opt('Explore other programs','mva_q')]);
add('ssdi_fulltime','SSDI screening','Full-time work','Are you currently working full time?','Source: yes → next program.',[opt('Yes — next program','ssdi_utility'),opt('No — continue','ssdi_job')]);
add('ssdi_job','SSDI screening','Full-time job plans','Do you plan to work full time or are you actively looking for a full-time job this year?','Source: yes → next program.',[opt('Yes — next','ssdi_utility'),opt('No — continue','ssdi_part')]);
add('ssdi_part','SSDI screening','Part-time earnings','Do you currently work part time and earn less than $1,470 per month, or are you unemployed?','This dollar amount appears in the source but may be outdated. Confirm current SSDI requirements.',[opt('Yes / unemployed — continue','ssdi_disability'),opt('No — next','ssdi_utility')]);
add('ssdi_disability','SSDI screening','Disability preventing work','Do you have an injury, illness, or disability preventing you from working full time?','Screening only, not a disability determination.',[opt('Yes','ssdi_work'),opt('No','ssdi_utility')]);
add('ssdi_work','SSDI screening','Prior work history','Have you worked full time at least five of the past ten years before your disability?','Source preliminary screen.',[opt('Yes','ssdi_benefits'),opt('No','ssdi_utility')]);
add('ssdi_benefits','SSDI screening','Existing disability benefits','Are you currently receiving disability benefits?','Source: yes → next program.',[opt('Yes','ssdi_utility'),opt('No','ssdi_lawyer')]);
add('ssdi_lawyer','SSDI screening','Existing SSDI lawyer','Have you already hired a lawyer for your SSDI claim?','Source indicates no → SSDI priority-one transfer candidate.',[opt('Yes','ssdi_utility'),opt('No — offer SSDI','ssdi_offer')]);
add('ssdi_offer','SSDI transfer','Offer SSDI specialist','A specialist may be able to review whether you qualify for disability benefits. Would you like me to connect you for an eligibility discussion?','Do not promise a benefit amount or approval. The source prioritizes SSDI for qualified members.',[opt('Yes — transfer','ssdi_transfer'),opt('No — continue','ssdi_utility')]);
add('ssdi_transfer','Transfer','SSDI transfer','Great. The disability specialist can discuss your situation and potential program options. Please stay on the line while I connect you.','Confirm YES. Source instructs the transferring agent to disconnect after the sales agent successfully connects.',[opt('Complete','end'),opt('Continue screening','ssdi_utility')]);
add('ssdi_utility','Utility screening','PIPP / CAPP assistance','Are you already receiving utility bill assistance through PIPP or CAPP?','If asked: PIPP and CAPP are utility assistance programs with income-based arrangements. The source says yes is a disqualifier for an unspecified utility plan, so do not infer eligibility without a current program guide.',[opt('Continue — other programs','mva_q')]);
add('medicare_state','Medicare screening','Check eligible states','First, let’s check whether a Medicare review is available where you live.','Medicare states in source: VA, TN, FL, TX, AZ, MD, IL, AL, NY, MS, NJ, NC, SC, OH, CA. MedSUPP has a different, longer state list. Confirm the correct partner/state list.',[opt('State is available','medicare_parts'),opt('Unavailable / unsure','mva_q')]);
add('medicare_parts','Medicare screening','Medicare Parts A and B','Do you currently have Medicare Parts A and B?','Source: no → Internet.',[opt('Yes','medicare_medicaid'),opt('No','internet_offer')]);
add('medicare_medicaid','Medicare screening','Medicaid status','Are you currently on Medicaid?','Source: yes → do not offer this Medicare flow; move to Internet.',[opt('No — continue','medicare_needs'),opt('Yes — Internet','internet_offer')]);
add('medicare_needs','Medicare screening','Coverage needs','Who is your current Medicare plan with? What do you like most about it? If you could improve one thing—copays, dental, vision, hearing, or other coverage—what would it be?','Do not enter provider or coverage answers here. This is simply the read-aloud guide.',[opt('Continue — offer review','medicare_offer')]);
add('medicare_offer','Medicare transfer','Offer licensed specialist review','A licensed Medicare specialist can review what benefits and plans may be available in your area and whether they fit your needs. Benefits vary by plan and county. May I connect you?','No guaranteed plan benefits. Do not ask for a Social Security number in this guide.',[opt('Yes — warm transfer','medicare_transfer'),opt('Not sure — explanation','medicare_hesitant'),opt('No — other programs','internet_offer')]);
add('medicare_hesitant','Medicare rebuttal','Hesitation','I understand. This is only a chance to review available Medicare options with a licensed specialist. A review does not mean you need to change plans. Would you like to speak with them?','ACA / Medicare rebuttals are also available in the top navigation.',[opt('Yes','medicare_transfer'),opt('No','internet_offer')]);
add('medicare_transfer','Warm transfer','Medicare handshake','Thank you. I’ll connect you with a licensed Medicare agent who can review your coverage and answer questions.\n\nTo the specialist: I have a Helping Hands member on the line who would like to explore Medicare options. Thank you.','WARM TRANSFER. Consent required.',[opt('Complete','end'),opt('Explore Internet','internet_offer')]);
add('mva_q','MVA screening','Recent motor-vehicle accident','Have you been in a motor-vehicle accident in the last two years, regardless of who was at fault?','Source: yes → offer MVA specialist. For the 18–48 script this is placed after ACA disqualification.',[opt('Yes — offer specialist','mva_offer'),opt('No — other programs','internet_offer')]);
add('mva_offer','MVA transfer','Offer MVA specialist','Based on the recent accident you mentioned, I can connect you with a specialist to discuss possible help with accident-related legal claims. Would you like me to connect you?','Avoid guaranteeing legal representation or claim outcomes.',[opt('Yes — transfer','mva_transfer'),opt('No — continue','internet_offer')]);
add('mva_transfer','Transfer','MVA transfer','Please stay on the line while I connect you with a specialist to discuss the accident and possible options.','Follow your approved transfer and consent procedure.',[opt('Complete','end'),opt('Continue','internet_offer')]);
add('internet_offer','Internet screening','Discounted internet','Some internet providers may offer discounted high-speed internet options. Would you be interested in checking what is available in your area?','Source says offer Internet in all tracks.',[opt('Yes — residence question','internet_home'),opt('Not sure — rebuttal','internet_hesitant'),opt('No — next program','edu_gate')]);
add('internet_hesitant','Internet rebuttal','Internet concerns','We can arrange a brief consultation to see which internet services might be available in your area. There’s no obligation to choose a plan. Would you like to check?','Do not guarantee any price or discount.',[opt('Yes','internet_home'),opt('No','edu_gate')]);
add('internet_home','Internet screening','Primary residence','Do you have a primary residence where internet service could be installed, and do you manage the internet service there?','Source requires yes.',[opt('Yes — transfer','internet_transfer'),opt('No — next','edu_gate')]);
add('internet_transfer','Transfer','Internet handshake','Great. I’ll connect you with a specialist to review available internet options.\n\nTo the specialist: I have a Helping Hands member who is interested in the Internet Program. I’ll hand the call over now.','Confirm explicit consent before transfer.',[opt('Complete','end'),opt('Other programs','edu_gate')]);
add('edu_gate','Education screening','Check education exclusions','Educational grants may be worth exploring for some members.','Do NOT offer EDU for age 64+, homelessness, or Medicaid, according to the source. For the 64+ track, use Finish. Else continue only after verifying these exclusions.',[opt('Eligible age, not homeless, not Medicaid','edu_interest'),opt('Excluded / no interest','end')]);
add('edu_interest','Education screening','Interest in education','Would you be interested in exploring educational or training opportunities and possible financial assistance?','The source does not promise an award.',[opt('Yes','edu_diploma'),opt('No','end')]);
add('edu_diploma','Education screening','Diploma / GED','Do you have a high-school diploma or GED?','Source: no → disqualify.',[opt('Yes','edu_college'),opt('No','end')]);
add('edu_college','Education screening','Current enrollment','Are you currently enrolled in college or university?','Source: yes → disqualify.',[opt('No','edu_computer'),opt('Yes','end')]);
add('edu_computer','Education screening','Computer access','Do you own or have regular access to a computer or laptop?','Source: no → disqualify.',[opt('Yes — offer transfer','edu_offer'),opt('No','end')]);
add('edu_offer','Education transfer','Offer education specialist','I can connect you with an education specialist who can review available programs and potential grant options. Would you like me to connect you?','The source specifies a blind transfer without waiting for the receiving agent to answer. Confirm consent.',[opt('Yes — blind transfer','edu_transfer'),opt('No — close','end')]);
add('edu_transfer','Blind transfer','Education transfer instructions','Great. Please hold for a moment while I connect you with an education specialist. You may hear ringing or brief music while the call connects.','BLIND TRANSFER — according to the source: do not wait for the buyer to answer; no handoff.',[opt('Complete call','end')]);
add('end','Close','Close the call','Thank you for speaking with Helping Hands today. You can visit the Helping Hands website for information about available resources. Have a wonderful day.','Call flow completed. Choose Reset Call to start a new script. No caller data has been retained.',[opt('↻ Start a new call','start')]);
const rebuttals={debt:[['Why offer debt relief?','The purpose is to explore whether the member has more manageable repayment options, potentially reducing monthly pressure, preventing further financial hardship, and creating a realistic plan. Terms depend on eligibility and the program.'],['Agent response','I appreciate you sharing your situation. I am offering this option to see whether a specialist can help you explore more manageable ways to address your outstanding debts. We want to make sure any arrangement is realistic for your budget.'],['“I can’t even afford my bills.”','That is exactly why we want to see whether a more manageable option exists. A specialist can discuss your situation and help determine whether the program would actually be suitable for your budget.']],health:[['Why offer ACA or Medicare?','Health coverage may help with access to medical services, unexpected expenses, and predictable healthcare costs. ACA premium tax credits depend on eligibility; Medicare benefits vary by plan and location.'],['Agent response','I understand your expenses are a concern. This review is simply to see whether any affordable health coverage or Medicare plan options are available for your circumstances. A specialist can explain the costs and benefits so you can decide whether they make sense.'],['“I can’t afford insurance.”','I understand, and I would not want to add to your financial stress. Before ruling it out, a specialist can check whether any financial assistance or more affordable coverage options are available. There is no obligation to choose a plan.']],general:[['“I’m not interested.”','I understand. No problem. If you change your mind, a specialist can explain available options and eligibility. Would you like to continue with another program?'],['“Is there a cost?”','I am helping with preliminary screening. The specialist can explain any costs, conditions, or fees before you make a decision.'],['“What is Helping Hands?”','Helping Hands shares information about programs, resources, and benefits members may be eligible to explore.'],['“How did you get my information?”','Please refer to your approved company disclosure and verify the member’s source of contact before making a claim.'],['“I need rent, food, or utility support.”','I understand those are your priorities. I can share the programs available to discuss on this call, and you can also look for local agencies supporting rental, food, and utility needs.'],['Questions about detailed eligibility','That is a good question. The specialist can explain the program’s eligibility, costs, and terms after reviewing your circumstances.']]};
let current='start',history=[],visited=['start'];function go(dest){const target=typeof dest==='function'?dest():dest;if(!N[target]){console.error('Unknown node',target);return}if(current==='age'){if(target==='young_income')activeTrack='young';if(target==='middle_income')activeTrack='middle';if(target==='senior_income')activeTrack='senior'}if(current==='edu_gate'&&activeTrack==='senior'&&target==='edu_interest'){return go('end')}history.push(current);current=target;visited.push(target);render()}
function render(){const n=N[current];document.getElementById('phase').textContent=n.phase;document.getElementById('heading').textContent=n.title;document.getElementById('bodyText').textContent=n.script;document.getElementById('note').textContent=n.note;document.getElementById('source').textContent='Source: '+n.source;const ch=document.getElementById('choices');ch.replaceChildren();n.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.label;b.className=i===0?'primary':'';b.addEventListener('click',()=>go(o.to));ch.appendChild(b)});document.getElementById('backBtn').disabled=!history.length;document.getElementById('trail').textContent='Step '+visited.length+' • '+(activeTrack==='young'?'18–48':activeTrack==='middle'?'49–63':'64+');const stages=['Intro','Income screening','Debt screening','Financial screening',activeTrack==='young'?'ACA screening':activeTrack==='middle'?'SSDI screening':'Medicare screening','MVA screening','Internet screening','Education screening','Close'];document.getElementById('stages').replaceChildren(...stages.map(t=>{const e=document.createElement('div');e.className='track'+(n.phase===t||n.phase.includes(t.split(' ')[0])?' active':'');e.textContent=t;return e}));document.getElementById('progressBar').style.width=(Math.min(100,visited.length*5))+'%';document.getElementById('counter').textContent=visited.length+' screen(s) visited';}
function reset(){current='start';history=[];visited=['start'];activeTrack='young';render();window.scrollTo({top:0,behavior:'smooth'})}function back(){if(!history.length)return;current=history.pop();visited.pop();render()}
function showRebut(tab){const overlay=document.getElementById('overlay');overlay.classList.add('show');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));const host=document.getElementById('rebutContent');host.replaceChildren();for(const [title,content] of rebuttals[tab]){const el=document.createElement('div');el.className='rebuttal';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('div');p.textContent=content;el.append(h,p);host.appendChild(el)}document.getElementById('closeModal').focus()}
document.querySelectorAll('[data-rebut]').forEach(b=>b.addEventListener('click',()=>showRebut(b.dataset.rebut)));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showRebut(b.dataset.tab)));document.getElementById('closeModal').onclick=()=>document.getElementById('overlay').classList.remove('show');document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')e.target.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('show')});document.getElementById('backBtn').onclick=back;document.getElementById('resetTop').onclick=reset;document.getElementById('resetBottom').onclick=reset;render();
</script></body></html>
